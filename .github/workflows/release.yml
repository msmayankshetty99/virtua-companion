name: Desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple silicon (arm64): it builds the Metal bundle and a DMG (electron/native_backends.json).
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The native CUDA/Vulkan builds and the freeze take hours on hosted runners; the checks that can hang have their own limits.
    timeout-minutes: 300
    defaults:
      run:
        # bash -eo pipefail stops a step at its first failing command; Windows' default pwsh checks only the last one.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libportaudio2 libsndfile1 libasound2-dev libfuse2 patchelf
      - name: Linux Vulkan SDK shader compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://sdk.lunarg.com/sdk/download/1.3.296.0/linux/vulkansdk-linux-x86_64-1.3.296.0.tar.xz --output "$RUNNER_TEMP/vulkan-sdk.tar.xz"
          mkdir -p "$RUNNER_TEMP/vulkan-sdk"
          tar -xJf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk" --strip-components=1
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan-sdk/x86_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/vulkan-sdk/x86_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/vulkan-sdk/x86_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$RUNNER_TEMP/vulkan-sdk/x86_64/bin/glslc" --version
      - name: CUDA build toolkit
        if: runner.os != 'macOS'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.4.1'
          method: network
      - name: Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe -OutFile "$env:RUNNER_TEMP/vulkan.exe"
          Start-Process "$env:RUNNER_TEMP/vulkan.exe" -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\1.3.296.0" >> $env:GITHUB_ENV
          "C:\VulkanSDK\1.3.296.0\Bin" >> $env:GITHUB_PATH
      - name: Python runtime dependencies
        # Exactly the versions in the hash-locked files from tools/release/lock.py; torch is the CPU build. On macOS the lock
        # names the plain PyPI torch wheel, which --require-hashes selects even with the extra index.
        run: |
          python -m pip install --require-hashes -r tools/release/requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --require-hashes --no-deps -r tools/release/requirements-lock-no-deps.txt
      - name: Frontend dependencies
        working-directory: electron
        run: npm ci
      - name: Frontend tests and build
        # Before the native build, so a JavaScript failure stops the job in minutes rather than after hours.
        timeout-minutes: 20
        working-directory: electron
        run: |
          npm test
          npm run build
      - name: Backend release regression checks
        timeout-minutes: 30
        env:
          RIKO_RELEASE_BUILD: '1'
        run: python -m pytest tests/test_release_build.py tests/test_release_config.py tests/test_llama_native.py tests/test_responses_wire.py tests/test_settings_store.py tests/test_dependency_manifests.py -q --timeout=300
      - name: Build the native backends and freeze Python
        # CUDA and Vulkan on Windows and Linux, Metal on macOS: the backends electron/native_backends.json ships for the OS.
        run: python tools/release/build.py
      - name: Package installers
        timeout-minutes: 60
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional macOS signing secrets, given only to the macOS leg. Without them the app is signed ad hoc
          # (electron/build/mac_sign.cjs) and Gatekeeper asks users to approve it in System Settings.
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          MAC_NOTARY_KEY: ${{ runner.os == 'macOS' && secrets.MAC_NOTARY_KEY || '' }}
          MAC_NOTARY_KEY_ID: ${{ runner.os == 'macOS' && secrets.MAC_NOTARY_KEY_ID || '' }}
          MAC_NOTARY_ISSUER: ${{ runner.os == 'macOS' && secrets.MAC_NOTARY_ISSUER || '' }}
        # The deb target needs a homepage, and electron-builder looks for .git only in electron/. Quoted for pwsh.
        run: |
          # electron-builder reads an empty CSC_LINK as a certificate to import, so these are exported only when set:
          # a Developer ID certificate (base64 .p12), then an App Store Connect API key (.p8 text) to notarize with.
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD" CSC_IDENTITY_AUTO_DISCOVERY=true
            if [ -n "$MAC_NOTARY_KEY" ]; then
              printf '%s\n' "$MAC_NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8" APPLE_API_KEY_ID="$MAC_NOTARY_KEY_ID" APPLE_API_ISSUER="$MAC_NOTARY_ISSUER"
            fi
          fi
          npx --no-install electron-builder --config electron-builder.yml --publish never "-c.extraMetadata.homepage=${{ github.server_url }}/${{ github.repository }}"
      - name: Release check inside the signed macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 30
        # build.py checked the unsigned stage; this repeats it under the hardened runtime and entitlements users get.
        run: python tools/release/build.py --check-app electron/release/mac-arm64/Riko.app
      - uses: actions/upload-artifact@v4
        with:
          name: Riko-${{ runner.os }}-${{ runner.os == 'macOS' && 'arm64' || 'x64' }}
          path: |
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.dmg
          if-no-files-found: error
